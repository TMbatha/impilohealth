<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Health</title>
  <link rel="icon" href="./mobile/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./shared/fx.css">
  <style>
    .topbar { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--brand-ink); }
    .topbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; color: inherit; text-decoration: none; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    .nav a { color: inherit; text-decoration: none; padding: 6px 12px; border-radius: 10px; font-weight: 600; opacity: .85; }
    .nav a[aria-current="page"] { background: rgba(255,255,255,.18); opacity: 1; }
    .role { display: inline-flex; border-radius: 999px; background: rgba(0,0,0,.18); padding: 3px; }
    .role button { border: 0; background: transparent; color: inherit; padding: 6px 14px; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .role button[aria-pressed="true"] { background: var(--surface); color: var(--brand); }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
    .narrow { max-width: 760px; }
    .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 8px; }
    .hero .card { margin: 0; }
    .welcome h2 { font-size: 1.8rem; }
    .section-title { margin: 26px 0 10px; font-size: 1.1rem; }
    .console { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
    .console-side { position: sticky; top: 76px; }
    .console-side textarea { width: 100%; min-height: 260px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); resize: vertical; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .queue-item:hover { border-color: var(--brand); }
    .confirm { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 12px; font-weight: 650; }
    .help dt { font-weight: 700; margin-top: 12px; } .help dd { margin: 4px 0 0; color: var(--muted); }
    .back { display: inline-block; margin-bottom: 12px; font-weight: 600; text-decoration: none; }
    .page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .page-head h2 { margin: 0; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-danger { background: var(--bad-soft); color: var(--bad); }
    .btn-sm { padding: 6px 12px; }
    .link-danger { background: none; border: 0; color: var(--bad); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }
    .confirm-inline { color: var(--ok); font-weight: 650; margin: 10px 0 0; }
    .table-wrap { overflow-x: auto; padding: 0; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .table th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .table td.actions { white-space: nowrap; display: flex; gap: 12px; align-items: center; }
    .table input, .table select { width: 100%; min-width: 120px; }
    .form label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .9rem; margin-bottom: 12px; }
    .form input, .form select, .form textarea, .table input, .table select { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    .form fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 0; margin: 0 0 14px; }
    .form legend { font-weight: 700; padding: 0 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
    .bp { display: flex; align-items: center; gap: 6px; } .bp input { width: 100%; }
    .small-link { font-size: .82rem; font-weight: 600; }
    .history { list-style: none; padding: 0; margin: 0; } .history li { padding: 8px 0; border-top: 1px solid var(--line); } .history li:first-child { border-top: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    /* plainer header */
    .topbar { background: var(--surface); color: var(--text); border-bottom: 1px solid var(--line); }
    .logo { color: var(--brand); font-weight: 700; font-size: 1.05rem; }
    .nav a { opacity: 1; color: var(--muted); border-radius: 0; padding: 6px 10px; border-bottom: 2px solid transparent; }
    .nav a[aria-current="page"] { background: none; color: var(--text); border-bottom-color: var(--brand); }
    .role { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 2px; }
    .role button { border-radius: 4px; padding: 4px 12px; color: var(--muted); font-weight: 600; }
    .role button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
    .welcome h2 { font-size: 1.35rem; }
    .table th { text-transform: none; letter-spacing: 0; font-size: .82rem; }
    .confirm { border-radius: 4px; }
    @media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    @media (max-width: 860px) { .hero, .console { grid-template-columns: 1fr; } .console-side { position: static; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/">FX Health</a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="role" role="group" aria-label="View as">
        <button type="button" data-role="member">Member</button>
        <button type="button" data-role="clinician">Clinician</button>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
