<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e6e5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FX Health">
  <title>FX Health</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="../shared/fx.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; background: var(--bg); }
    .m-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; background: var(--brand); color: var(--brand-ink); }
    .m-top h1 { font-size: 1.1rem; margin: 0; flex: 1; }
    .m-top button { border: 0; background: rgba(255,255,255,.18); color: inherit; border-radius: 10px; padding: 6px 10px; font-weight: 700; min-height: 36px; min-width: 36px; }
    .m-main { flex: 1; padding: 16px 16px calc(84px + env(safe-area-inset-bottom)); }
    .m-tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .m-tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; text-decoration: none; color: var(--muted); font-size: .78rem; font-weight: 650; min-height: 56px; }
    .m-tabs a .ico { font-size: 1.3rem; line-height: 1; }
    .m-tabs a[aria-current="page"] { color: var(--brand); }
    .m-main .card { padding: 16px; }
    .analyte-value { font-size: 1.45rem; }
    .stats { grid-template-columns: 1fr 1fr; }
    .install { display: none; }
    .m-top button { border-radius: 5px; }
    .m-tabs a .ico { display: none; }
    .m-tabs a { justify-content: center; font-size: .85rem; border-top: 2px solid transparent; }
    .m-tabs a[aria-current="page"] { border-top-color: var(--brand); }
    .help dt { font-weight: 700; margin-top: 12px; } .help dd { margin: 4px 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <header class="m-top">
    <button id="back" type="button" aria-label="Back" hidden>‹</button>
    <h1 id="title">FX Health</h1>
    <button id="install" class="install" type="button">Install</button>
    <button id="refresh" type="button" aria-label="Refresh">↻</button>
  </header>
  <main class="m-main" id="app" tabindex="-1"></main>
  <nav class="m-tabs" aria-label="Main">
    <a href="#/" data-tab="home"><span class="ico" aria-hidden="true">⌂</span>Home</a>
    <a href="#/results" data-tab="results"><span class="ico" aria-hidden="true">▤</span>Results</a>
    <a href="#/help" data-tab="help"><span class="ico" aria-hidden="true">?</span>Help</a>
  </nav>
  <script type="module" src="./mobile.js"></script>
</body>
</html>
